[package]
name = "msx-harness"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "msx"
path = "src/bin/msx.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand_chacha = "0.3"
rand_core = "0.6"

[dev-dependencies]
msx-kernels = { path = "../kernels" }
